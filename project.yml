# XcodeGen specification for Umbrella.xcodeproj.
#
# The generated project is committed, so this file is not needed to build — it
# exists as the readable source of truth for the project structure and as a way
# to regenerate the project from scratch:
#
#     brew install xcodegen && xcodegen generate
#
# Keep it in step with Umbrella.xcodeproj when targets or settings change.

name: Umbrella
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE

targets:
  UmbrellaApp:
    type: application
    platform: iOS
    sources:
      - path: UmbrellaApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.umbrella
        INFOPLIST_FILE: UmbrellaApp/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: UmbrellaApp/UmbrellaApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    dependencies:
      - target: UmbrellaWidgetExtension
        embed: true

  UmbrellaWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: UmbrellaWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.umbrella.widget
        INFOPLIST_FILE: UmbrellaWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: UmbrellaWidget/UmbrellaWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"

  # A logic-only bundle with no test host: it compiles the shared sources
  # itself, so no @testable import of the app is needed. The two CoreLocation
  # dependent files are left out because nothing here exercises them.
  UmbrellaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UmbrellaTests
      - path: Shared
        excludes:
          - LocationProvider.swift
          - UmbrellaRefresher.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.umbrella.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UmbrellaApp:
    build:
      targets:
        UmbrellaApp: all
        UmbrellaWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UmbrellaTests
